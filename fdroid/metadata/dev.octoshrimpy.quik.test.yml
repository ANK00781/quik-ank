Description: |
  QUIK Test is an open source replacement for the stock messaging app on Android.
  It displays SMS/MMS conversations, supports scheduled sends, backups, voice
  messages, speech-to-text and text-to-speech, and more.
  It works fully offline: all messages are stored on the device and no data is
  sent to any server.
